  const root=gltf.scene;scene.add(root);
  const rm=[];root.traverse(o=>{if(o.isLight)rm.push(o)});rm.forEach(o=>o.parent.remove(o));
  root.traverse(o=>{if(o.isMesh&&o.name!=='BulbGlass'&&o.name!=='BulbNeck'&&o.name!=='Filament'){o.castShadow=true;o.receiveShadow=true}});
  const g=n=>root.getObjectByName(n);
  head=g('HeadPivot');arm2=g('Arm2Pivot');pull=g('PullRoot');bead=g('PullBead');str=g('PullString');
  fil=g('Filament').material;glass=g('BulbGlass').material;glass.depthWrite=false;
  const warm=new THREE.Color(1,0.71,0.42);fil.emissive=warm.clone();fil.emissiveIntensity=0;glass.emissive=warm.clone();glass.emissiveIntensity=0;
  baseRz=head.rotation.z;
  spot=new THREE.SpotLight(0xffb56b,0,0,1.12,0.5,2);spot.position.set(0.09,0,0);spot.castShadow=true;spot.shadow.mapSize.set(2048,2048);spot.shadow.bias=-0.0004;spot.shadow.normalBias=0.003;spot.shadow.camera.near=0.02;
  bl=new THREE.PointLight(0xffb56b,0,0.45,2);bl.position.set(0.09,0,0);bl.castShadow=true;bl.shadow.mapSize.set(512,512);bl.shadow.bias=-0.001;bl.shadow.normalBias=0.004;bl.shadow.camera.near=0.02;head.add(bl);
  const tgt=new THREE.Object3D();tgt.position.set(1,0,0);head.add(tgt);spot.target=tgt;head.add(spot);
  const CL=0.9,cg=new THREE.CylinderGeometry(0.075+CL*0.85,0.075,CL,64,1,true);cg.translate(0,CL/2,0);cg.rotateZ(-Math.PI/2);
  cone=new THREE.Mesh(cg,new THREE.ShaderMaterial({uniforms:{uI:{value:0},uC:{value:new THREE.Color(1,0.74,0.45)},uL:{value:CL}},transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,vertexShader:'varying float vT;varying float vF;uniform float uL;void main(){vT=position.x/uL;vec3 n=normalize(normalMatrix*normal);vec4 mv=modelViewMatrix*vec4(position,1.0);vF=abs(dot(n,normalize(-mv.xyz)));gl_Position=projectionMatrix*mv;}',fragmentShader:'varying float vT;varying float vF;uniform float uI;uniform vec3 uC;void main(){float a=uI*pow(1.0-vT,1.6)*pow(vF,2.0);gl_FragColor=vec4(uC,a);}'}));
  cone.position.set(0.115,0,0);head.add(cone);
  hit=new THREE.Mesh(new THREE.SphereGeometry(0.055,12,12),new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}));
  hit.position.y=-0.01;bead.add(hit);
  ring=new THREE.Mesh(new THREE.RingGeometry(0.02,0.026,40),new THREE.MeshBasicMaterial({color:0xffc98a,transparent:true,opacity:0.95,depthTest:false,side:THREE.DoubleSide}));ring.renderOrder=10;ring.position.y=-0.003;bead.add(ring);
  requestAnimationFrame(loop);
},e=>{document.getElementById('err').style.display='flex'});

let p=0,v=0,w=0,wv=0,on=false,tEv=-9,dragging=false,startY=0,startP=0,last=performance.now();
const K=1200,C=10,KW=300,CW=3;
function glow(now){
  const r=(now-tEv)/1000;
  if(on){
    if(r<0)return 0;
    const k=[[0.08,0],[0.17,0.8],[0.25,0],[0.33,0.9],[0.42,0],[0.5,0.85]];
    for(const[e,val]of k)if(r<e)return val;
    return Math.min(1,0.85+0.15*(r-0.5)/0.4);
  }
  return Math.max(0,1-r/0.08);
}
function loop(now){
  const dt=Math.min((now-last)/1000,0.05);last=now;
  if(auto){const u=(now-tAuto)/280;if(u<1){p=0.0508*u*u;v=0}else{auto=false;p=0.0508;v=0;fin()}}
  for(let i=0;i<4;i++){const h=dt/4;
    if(!dragging&&!auto){v+=(-K*p-C*v)*h;p+=v*h}
    wv+=(-KW*w-CW*wv)*h;w+=wv*h}
  const pv=Math.max(p,-0.015);
  if(ring){ring.visible=!used&&!dragging;bead.getWorldQuaternion(QQ);ring.quaternion.copy(QQ.invert().multiply(cam.quaternion));const s=1+0.2*Math.sin(now/220);ring.scale.set(s,s,s)}
  bead.position.y=-L-pv;str.scale.y=(L+pv)/L;
  head.rotation.z=baseRz+w;arm2.rotation.z=0.3*w;pull.rotation.z=-head.rotation.z;
  const g=glow(now);
  fil.emissiveIntensity=g*3;glass.emissiveIntensity=g*0.7;spot.intensity=g*1.1;bl.intensity=g*0.02;cone.material.uniforms.uI.value=g*0.16;
  st.textContent=on?(g<0.9?'Flickering…':'Light on'):'Light off';
  ctl.update();R.render(scene,cam);requestAnimationFrame(loop);
}
const rc=new THREE.Raycaster(),m=new THREE.Vector2(),plane=new THREE.Plane(),pt=new THREE.Vector3(),pt0=new THREE.Vector3();
function ray(e){const r=R.domElement.getBoundingClientRect();m.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);rc.setFromCamera(m,cam)}
const el=R.domElement;
el.addEventListener('pointerdown',e=>{
  if(!hit)return;ray(e);
  if(rc.intersectObject(hit).length){
    dragging=true;ctl.enabled=false;e.stopImmediatePropagation();e.preventDefault();el.setPointerCapture(e.pointerId);down=[e.clientX,e.clientY];
    const n=new THREE.Vector3();cam.getWorldDirection(n);
    plane.setFromNormalAndCoplanarPoint(n.negate(),bead.getWorldPosition(new THREE.Vector3()));
    rc.ray.intersectPlane(plane,pt0);startY=pt0.y;startP=p;el.style.cursor='grabbing';
  }
},true);
el.addEventListener('pointermove',e=>{
  if(!hit)return;ray(e);
  if(dragging){
    if(rc.ray.intersectPlane(plane,pt)){const raw=Math.max(0,startP+(startY-pt.y));p=0.065*Math.tanh(raw/0.065);v=0}
  }else el.style.cursor=rc.intersectObject(hit).length?'grab':'default';
});
function fin(){wv+=7;if(p>=0.03){on=!on;tEv=performance.now();used=true}}
function release(e){
  if(!dragging)return;dragging=false;ctl.enabled=true;el.style.cursor='grab';
  const tap=e&&Math.hypot(e.clientX-down[0],e.clientY-down[1])<6;
  if(tap&&p<0.03){p=0;auto=true;tAuto=performance.now();return}
  fin();
}
document.getElementById('pb').onclick=()=>{if(!auto&&!dragging){auto=true;tAuto=performance.now()}};
el.addEventListener('pointerup',release);el.addEventListener('pointercancel',release);
})();
</script></body></html>
